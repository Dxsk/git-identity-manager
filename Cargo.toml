[package]
name = "git-identity-manager"
version = "1.2.0"
edition = "2024"
description = "Switch between Git identities per repository"
license = "MIT"
repository = "https://github.com/Dxsk/git-identity-manager"
rust-version = "1.85"
homepage = "https://github.com/Dxsk/git-identity-manager"
readme = "README.md"
keywords = ["git", "identity", "cli", "config", "email"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md", "/identities.example.json"]

# The crate name git-identity is taken on crates.io; the command keeps it.
[[bin]]
name = "git-identity"
path = "src/main.rs"

[dependencies]
console = { version = "0.16.6", default-features = false }
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
